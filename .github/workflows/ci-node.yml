name: CI Node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains package.json, pnpm-lock.yaml, and .nvmrc
        type: string
        required: false
        default: "."
      command:
        description: Smoke or test command to run after install
        type: string
        required: false
        default: "pnpm test"
      audit:
        description: Run pnpm audit after install
        type: boolean
        required: false
        default: true
      audit-level:
        description: Minimum advisory severity that fails pnpm audit (low, moderate, high, critical)
        type: string
        required: false
        default: high

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        if: ${{ inputs.audit }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --audit-level "$AUDIT_LEVEL"

      - name: Test
        env:
          CMD: ${{ inputs.command }}
        run: bash -c "$CMD"
